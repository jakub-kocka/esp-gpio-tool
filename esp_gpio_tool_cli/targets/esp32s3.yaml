  19: { power_domain: VDD3P3_RTC,     functions: ['USB_OTG_D-', 'USB_D-', 'ADC2_CH8', 'RTC_GPIO19', 'U1RTS', 'CLK_OUT2'] }
  20: { power_domain: VDD3P3_RTC,     functions: ['USB_OTG_D+', 'USB_D+', 'ADC2_CH9', 'RTC_GPIO20', 'U1CTS', 'CLK_OUT1'] }
  21: { power_domain: VDD3P3_RTC,     functions: ['RTC_GPIO21', 'USB_RCV'] }
