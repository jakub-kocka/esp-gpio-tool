peripheral:
  ADC:
    count: 2
    channels: 10
    assigned_pins: [ "ADC{count}_CH{{channel}}" ]
  UART:
    count: 3
    assigned_pins: [ "U{count}TXD", "U{count}RXD", "U{count}CTS", "U{count}RTS", "U{count}DTR", "U{count}DSR" ]
  RTC:
    count: 22
    assigned_pins: [ "RTC_GPIO{count}" ]
  JTAG:
    count: 1
    assigned_pins: [ MTCK, MTDO, MTMS, MTDI ]
  TOUCH:
    count: 14
    start_cnt: 1
    assigned_pins: [ "TOUCH{count}" ]
  I2C:
    count: 2
    universal_pins: [ "I2C{count}_SCL", "I2C{count}_SDA" ]
  I2S:
    count: 2
    universal_pins: ["I2S{count}_WS", "I2S{count}_SD", "I2S{count}_CLK" ]
  SPI:
    # TODO SUBSPI
    # SPI0/1 interface for connection to in-package or off-package flash/PSRAM via SUBSPI bus (separate
    # bus for voltages differing from SPI bus). Note that the fast SPI2 interface will not be available
    # reference Page 16 - datasheet

    # SPI0 uses the same pins as SPI1 so actual count is 3
    count: 3 # SPI0, SPI1, SPI2, SPI3
    subname: [ SPI, SPI2, SPI3 ]
    modes: {'SPI': [Single SPI, Dual SPI, Quad SPI, Octal SPI, QPI, OPI],
            'SPI2': [Single SPI, Dual SPI, Quad SPI, Octal SPI, QPI, OPI],
            'SPI3': [Single SPI, Dual SPI, Quad SPI, QPI]
          }
    # Note: D -> MOSI, Q -> MISO, CLK -> CLK, CS0 -> CS
    assigned_pins: [ "{subname}HD", "{subname}WP", "{subname}CS0", "{subname}CS1", "{subname}CLK", "{subname}Q", "{subname}D", "{subname}IO4", "{subname}IO5", "{subname}IO6", "{subname}IO7", "{subname}DQS"]
  SDMMC:
    count: 2  # one controller -> two slots
    data_width: {'1': [1, 4, 8], '2': [1, 4, 8]}
    universal_pins: [ "SDHOST_CCLK_{count}", "SDHOST_RST_{count}", "SDHOST_CCMD_OD_PULLUP_EN_{count}", "SDHOST_SDIO_TOHOST_INT", "SDHOST_CCMD_{count}", "SDHOST_DATA_STROBE_{count}", "SDHOST_CARD_DETECT_{count}", "SDHOST_CARD_WRITE_PRT_{count}", "SDHOST_CARD_INT_{count}", "SDHOST_CDATA_{count}{{data_width}}" ]
  CLKOUT:
    count: 3
    assigned_pins: [ "CLK_OUT{count}" ]
  RMT:
    count: 4
    universal_pins: [ "RMT_SIG_IN{count}", "RMT_SIG_OUT{count}" ]
  MCPWM:  # Motor Control PWM
    count: 2
    channels: 3
    universal_pins: [ "MCPWM{count}_SYNC_IN{{channel}}", "MCPWM{count}_FLT_IN{{channel}}", "MCPWM{count}_CAP_IN{{channel}}", "MCPWM{count}_OUT{{channel}}A", "MCPWM{count}_OUT{{channel}}B" ]
  LEDC:  # LED PWM
    count: 8
    universal_pins: [ "LEDC_LS_SIG_OUT{count}" ]
  TWAI:
    count: 1
    universal_pins: [ TWAI_RX, TWAI_TX, TWAI_BUS_OFF_ON, TWAI_CLKOUT ]
  PCNT:  # Pulse Counter
    count: 4
    channels: 2
    universal_pins: [ "PCNT_SIG_CH{{channel}}_IN{count}", "PCNT_CTRL_CH{{channel}}_IN{count}" ]
  XTAL32K:  # external 32K crystal oscillator
    count: 1
    assigned_pins: [ XTAL_32K_P, XTAL_32K_N ]
  USBOTG:   # Full Speed USB OTG
    count: 1
    # Part "OTG" is not specified by the datasheet, it is only for the later resolution by the checker
    assigned_pins: [ "USB_OTG_D-", "USB_OTG_D+", "USB_OTG_EXT_VP", "USB_OTG_EXT_VM", "USB_OTG_RCV", "USB_OTG_EXT_OEN", "USB_OTG_EXT_VPO", "USB_OTG_EXT_VMO"]
  USBSERIALJTAG:  # USB Serial/JTAG
    count: 1
    assigned_pins: [ "USB_D-", "USB_D+", "USB_EXT_VP", "USB_EXT_VM", "USB_EXT_OEN", "USB_EXT_VPO", "USB_EXT_VMO"]
  LCDCAM:   # LCD and Camera Controller (LCD_CAM)
    count: 1
    subname: [ LCD, CAM ]
    channels: 16
    universal_pins: [ "{subname}_PCLK", LCD_DC, CAM_CLK, "{subname}_V_SYNC", "{subname}_H_SYNC", "{subname}_H_ENABLE", "{subname}_DATA{{channel}}" ]
    modes: {
      'LCD': [ 8 bit - Master TX Mode, 16 bit - Master TX Mode ],
      'CAM': [ 8 bit - Slave RX Mode, 16 bit - Slave RX Mode, 8 bit - Master RX Mode, 16 bit - Master RX Mode]
    }

# Note: PUP (wpu in datasheet) - pull up resistor enabled; PDOWN (wpd) - pull down resistor enabled
# Note: USB_OTG_EXT_VMO and USB_EXT_VMO (and similar USB related functions which contains "OTG") are the same as without "OTG" part, split into two only for later resolution by the checker
gpio:
  0:  { power_domain: VDD3P3_RTC,     functions: ['RTC_GPIO0'], strapping: "High for SPI Boot; Low for Download Mode", at_reset: PUP }
