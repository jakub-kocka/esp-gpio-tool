peripheral:
  ADC:
    count: 2
    channels: 10
    assigned_pins: [ "ADC{count}_CH{{channel}}" ]
  DAC:
    count: 2
    assigned_pins: [ "DAC_{count}" ]
  UART:
    count: 3
    assigned_pins: [ "U{count}TXD", "U{count}RXD", "U{count}CTS", "U{count}RTS" ]
  RTC:
    count: 17
    assigned_pins: [ "RTC_GPIO{count}" ]
  JTAG:
    count: 1
    assigned_pins: [ MTCK, MTDO, MTMS, MTDI ]
    warning: "JTAG assigned_pins are shared with GPIO assigned_pins"  # TODO: move warning text to python code?
  TOUCH:
    count: 10
    assigned_pins: [ "TOUCH{count}" ]
  EMAC:
    count: 1
    modes: [ RMII, MII ]
    # MII: TX_CLK, RX_CLK, TX_EN, TXD0, TXD1, TXD2, TXD3, RX_ER, RX_DV, RXD0, RXD1, RXD2, RXD3, TX_ER
    # RMII: TX_CLK, TX_EN, TXD0, TXD1, RX_DV, RXD0, RXD1
    assigned_pins: [ EMAC_TX_CLK, EMAC_RX_CLK, EMAC_TX_EN, EMAC_TXD0, EMAC_TXD1, EMAC_TXD2, EMAC_TXD3, EMAC_RX_ER, EMAC_RX_DV, EMAC_RXD0, EMAC_RXD1, EMAC_RXD2, EMAC_RXD3, EMAC_CLK_OUT, EMAC_CLK_OUT_180, EMAC_TX_ER ]
    any_pins: [ EMAC_MDC_out, EMAC_MDI_in, EMAC_MDO_out, EMAC_CRS_out, EMAC_COL_out]
  I2C:
    count: 2
    any_pins: [ "I2C{count}_SCL", "I2C{count}_SDA" ]
  I2S:
    count: 2
    any_pins: [WS, SD]
    assigned_pins: [ CLK_OUT* ] # Note: one CLK per I2S
  SPI:
    # SPI0 uses the same pins as SPI1 so actual count is 3
    count: 3 # SPI0, SPI1, SPI2 (HSPI), SPI3 (VSPI)
    subname: [ SPI, HSPI, VSPI ]
    modes: [ Three-line SPI, Four-line SPI, QSPI ]
    # Note: D -> MOSI, Q -> MISO, WP -> CLK, CS0 -> CS
    assigned_pins: [ "{subname}HD", "{subname}WP", "{subname}CS0", "{subname}CLK", "{subname}Q", "{subname}D" ]
  SDMMC:
    count: 2
    data_width: {1: [1, 4, 8], 2: [1, 4]}
    assigned_pins: [ "HS{count}_CLK", "HS{count}_CMD", "HS{count}_DATA{{data_width}}" ]
    any_pins: [card_detect_n, card_write_prt]  # optional card detect and write protect pins
  SDIO:
    count: 2
    assigned_pins: [ "SD{count}_CLK", "SD{count}_CMD", "SD{count}_DATA{{data_width}}"]
    data_width: {1: [1, 4], 2: [1, 4]}
    # internal flash, depending on the module, see. 2.5 Pin Mapping Between Chip and Flash/PSRAM of ESP32 Datasheet
    warning: {SDIO0: "assigned_pins may be used for connecting external flash"}
  CLK_OUT:
    count: 3
    assigned_pins: [ "CLK_OUT{count}" ]
  RMT:
    count: 8
    any_pins: [ "RMT_SIG_IN{count}", "RMT_SIG_OUT{count}" ]
  MCPWM:  # Motor Control PWM
    count: 3
    any_pins: [ "SYNC{count}", "FAULT{count}", "CAP{count}", "PWM{count}A", "PWM{count}B" ]
  LEDC:  # LED PWM
    count: 8
    any_pins: [ "LEDC_SIG_OUT{count}" ]
  TWAI:
    count: 1
    any_pins: [ twai_rx, twai_tx, twai_bus_off_on, twai_clkout ]
  PCNT:  # Pulse Counter
    count: 8
    channels: 2
    any_pins: [ "PCNT_SIG_CH{{channel}}_IN{count}", "PCNT_CTRL_CH{{channel}}_IN{count}" ]
  XTAL_32K:  # external 32K crystal oscillator
    count: 1
    assigned_pins: [ 32K_XP, 32K_XN ]

# TODO custom assertion for GPIOs
